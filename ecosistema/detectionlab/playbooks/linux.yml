familia: linux
nombre: Endpoint y servidor Linux
descripcion: |
    Ejecucion desde /tmp, persistencia por cron, historial deshabilitado,
    creacion de cuentas, base64 a interprete, descarga tuberia a shell, lectura
    de /etc/shadow, shell inversa, clave en authorized_keys y modificacion de
    ld.so.preload. El parque es corto comparado con el de Windows y tiene una
    diferencia que pesa en todo el triaje: practicamente todo lo que ven estas
    reglas es tambien como se administra un servidor Linux a mano. No existe
    una version sospechosa de chmod, de cron o de curl; existe quien los
    ejecuta, desde donde entro y si habia una ventana abierta. Con pocos
    equipos no hay poblacion para decidirlo por estadistica, asi que el peso
    cae en el enriquecimiento y en una pregunta que discrimina mejor que
    ninguna otra: si el mismo comando aparece hoy en toda la flota es
    administracion, y si aparece en uno solo no lo es.

enriquecimiento:
  - fuente: cti_local
    sobre: [ip, hash, dominio]
    detalle: Listas de intel/listas/ generadas desde News CTI
  - fuente: inventario
    sobre: [agente]
    detalle: Rol del servidor, si es produccion, propietario y ventana de mantenimiento asignada
  - fuente: gestion_accesos
    sobre: [usuario]
    detalle: Si la cuenta tiene sudo, si el acceso entro por el bastion y con que ticket
  - fuente: historico_siem
    sobre: [comando, agente]
    detalle: Si el mismo comando aparece hoy en otros equipos del mismo grupo y a la misma hora
  - fuente: calendario_cambios
    sobre: [agente]
    detalle: Ventana de parcheo o de despliegue de configuracion abierta

evidencia:
  - descripcion: Sesion que ejecuto el comando y por donde entro
    comando: "last -F, who -a y el registro de sesion del bastion para esa hora"
    donde: agente
  - descripcion: Arbol de procesos con el padre real y la hora de arranque
    comando: "ps -eo pid,ppid,lstart,user,args --forest"
    donde: agente
  - descripcion: Conexiones abiertas por el proceso y su contraparte en el cortafuegos
    comando: "ss -tunap y flujo del colector de red por IP del equipo"
    donde: agente
  - descripcion: Contenido de la persistencia creada, con marca de tiempo
    comando: "cat del crontab, de la unit de systemd, de authorized_keys o de /etc/ld.so.preload, mas stat"
    donde: agente
  - descripcion: Hash del binario y a que paquete pertenece
    comando: "sha256sum <ruta> y dpkg -S <ruta> o rpm -qf <ruta>"
    donde: agente
  - descripcion: Historial de la shell antes de que se borre
    comando: "cat de ~/.bash_history y del journal de la sesion"
    donde: agente
    nota: Varias reglas de esta familia detectan justamente el intento de eliminarlo. Se recoge lo primero.

triaje:
  - pregunta: El proceso padre es el gestor de paquetes o el agente de configuracion del parque y hay ventana de mantenimiento abierta
    fuente: calendario_cambios
    si_afirmativo: bajar_severidad
  - pregunta: El binario pertenece a un paquete instalado y verificado por el gestor
    fuente: evento
    si_afirmativo: bajar_severidad
    nota: Reduce, no descarta. Los binarios del sistema son la herramienta preferida de quien ya esta dentro y no quiere traer nada suyo.
  - pregunta: El mismo comando aparece hoy en varios equipos del mismo grupo y en la misma hora
    fuente: historico_siem
    si_afirmativo: bajar_severidad
    nota: La administracion es masiva y programada; la intrusion suele ser puntual.
  - pregunta: La sesion no entro por el bastion
    fuente: gestion_accesos
    si_afirmativo: subir_severidad
  - pregunta: La cuenta que ejecuta es de servicio y no deberia tener shell interactiva
    fuente: directorio
    si_afirmativo: subir_severidad
  - pregunta: El equipo es servidor de produccion expuesto a Internet
    fuente: inventario
    si_afirmativo: subir_severidad

cierre_automatico:
  # Una sola entrada, y es deliberado: el parque no da poblacion para
  # condiciones estadisticas. Las reglas de shell inversa, lectura de
  # /etc/shadow y ld.so.preload quedan fuera de cualquier cierre automatico,
  # tengan la ventana que tengan: ninguna operacion de mantenimiento
  # legitima necesita hacer esas tres cosas.
  - condicion: |
        Ejecucion o chmod +x sobre un fichero en /tmp, /var/tmp o /dev/shm
        (lin_chmod_tmp_exec) cuyo proceso padre es el gestor de paquetes o el
        agente de configuracion del parque, dentro de una ventana de
        mantenimiento abierta en el ITSM, y con el mismo evento presente en al
        menos otros dos equipos del mismo grupo en esa ventana.
    justificacion: |
        Desempaquetar y compilar en un directorio temporal es el funcionamiento
        normal de apt, dnf, ansible o salt, y produce esta alerta en cada ciclo
        de parcheo en todos los equipos a la vez. Parentesco, ventana declarada
        y caracter masivo de la operacion son tres hechos que no coinciden en
        una intrusion, que es puntual y no abre ticket. Si solo se comprobara el
        parentesco no valdria, porque bastaria con que un atacante lanzara su
        binario desde un hijo de apt; y si solo se comprobara la ventana
        tampoco, porque la ventana de parcheo es publica y es el mejor momento
        para esconderse.

contencion:
  - accion: Aislar el servidor en la red, dejando solo la comunicacion con el manager
    alcance: El equipo afectado. No toca cuentas ni otros equipos.
    radio: equipo
    reversible: "si"
    requiere_aprobacion: "no"
    justificacion: |
        Reversible en un comando. Conviene decir en voz alta que en este parque
        la excepcion es la norma y no la rareza: casi todo lo que corre Linux
        aqui es servidor, asi que en la practica esta accion casi siempre acaba
        preparada y en espera. Se deja como automatica de todos modos para los
        equipos de desarrollo y los puestos, donde el coste de aislar es el de
        siempre: veinte minutos.
    excepcion: |
        Si el inventario marca el equipo como servidor de produccion, NO se
        aisla: se prepara la accion y se pide aprobacion.
  - accion: Matar el proceso por PID y hora de arranque
    alcance: Un unico proceso. La hora de arranque evita matar a un homonimo tras la reutilizacion del PID.
    radio: proceso
    reversible: "no"
    requiere_aprobacion: "no"
    justificacion: |
        No se deshace, pero el alcance es un proceso y el error se paga con un
        servicio que hay que rearrancar. Frente a eso, una shell inversa viva es
        una sesion interactiva del atacante que avanza mientras se tria.
    excepcion: |
        Si el proceso pertenece a una unidad de systemd gestionada por el
        paquete de una aplicacion de produccion, no se mata: se anota y se
        prepara, porque el gestor de servicios lo reiniciara igual y el unico
        efecto sera un corte sin contencion.
  - accion: Congelar el fichero de persistencia copiandolo al almacen de evidencia y fijando retencion
    alcance: Copia de un fichero. No modifica el original.
    radio: objeto
    reversible: "si"
    requiere_aprobacion: "no"
    justificacion: |
        Copiar no rompe nada, y el cron o la unit que se acaba de crear es lo
        primero que un atacante limpia cuando nota que le miran. Sin la copia,
        el caso se queda sin la unica prueba de la persistencia.
  - accion: Retirar la clave publica anadida a authorized_keys, guardando antes el fichero completo
    alcance: Una linea de un fichero de un usuario
    radio: cuenta
    reversible: "si"
    requiere_aprobacion: "si"
    justificacion: |
        La accion en si se deshace restaurando el fichero guardado, pero
        mientras esta aplicada corta el acceso de quien use esa clave, y en un
        servidor sin consola fisica el que se queda fuera puede ser el equipo de
        sistemas en mitad de un cambio. El SOAR no sabe cual de las claves del
        fichero es la del atacante y cual es la del proveedor que entra cada
        martes: la marca de tiempo lo sugiere, no lo demuestra. Se deja
        preparada, con la huella de la clave resuelta y la copia hecha.

requiere_persona:
  - situacion: Revertir /etc/ld.so.preload
    motivo: |
        Tocar el precargado en caliente puede dejar el sistema sin poder
        ejecutar nada, incluido lo que hace falta para arreglarlo.
  - situacion: Sacar el servidor de balanceo
    motivo: Es capacidad de produccion y el SOAR no sabe cuantos nodos quedan.
  - situacion: Rotar las credenciales de servicio del equipo
    motivo: |
        Si la cuenta la usan aplicaciones, rotarla las tira. Hay que saber antes
        que depende de ella.
  - situacion: Eliminar la cuenta local creada
    motivo: Cortar el acceso a quien no debia tiene coste inmediato y visible.
  - situacion: Reconstruir el servidor
    motivo: Decision de negocio, no tecnica.

escalado:
  a: L2
  plazo_min: 20
  a_L3_si: Hay modificacion de ld.so.preload, shell inversa establecida o lectura de /etc/shadow en un servidor de produccion
