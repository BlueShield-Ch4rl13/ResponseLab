# ResponseLab: lista de webhooks permitidos (Splunk 9+).
# Copiar a $SPLUNK_HOME/etc/system/local/alert_actions.conf (o a la app) y
# sustituir MOTOR por el nombre o la IP del motor. Sin esta lista, Splunk 9
# descarta en silencio el webhook hacia una URL que no conoce.
# https://help.splunk.com/en/splunk-enterprise/alert-and-respond/alerting-manual/9.0/manage-alert-and-alert-action-permissions/configure-webhook-allow-list
[webhook]
enable_allowlist = true
allowlist.responselab = ^https:\/\/MOTOR(:\d+)?\/v1\/[a-z0-9_-]+\/alertas\/splunk
