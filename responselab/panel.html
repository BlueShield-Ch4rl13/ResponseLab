<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResponseLab · Panel</title>
<style>
  :root { --fondo:#f6f7f9; --panel:#ffffff; --texto:#1f2430; --suave:#5b6474; --borde:#dfe3ea;
          --acento:#0f766e; --peligro:#b42318; --aviso:#b54708; --ok:#027a48; --info:#175cd3; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#0f1218; --panel:#171b23; --texto:#e6e9ef; --suave:#98a2b3; --borde:#2a303b;
            --acento:#2dd4bf; --peligro:#f97066; --aviso:#fdb022; --ok:#32d583; --info:#84adff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fondo); color:var(--texto); }
  header { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; padding:.75rem 1rem; background:var(--panel);
           border-bottom:1px solid var(--borde); position:sticky; top:0; }
  header h1 { font-size:1rem; margin:0 1rem 0 0; letter-spacing:.02em; }
  header input { padding:.4rem .5rem; border:1px solid var(--borde); border-radius:6px; background:var(--fondo); color:var(--texto); }
  button { padding:.35rem .7rem; border:1px solid var(--borde); border-radius:6px; background:var(--panel); color:var(--texto); cursor:pointer; }
  button.primario { background:var(--acento); color:#fff; border-color:var(--acento); }
  button.peligro { color:var(--peligro); border-color:var(--peligro); }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap:1rem; padding:1rem; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:1rem; min-width:0; }
  h2 { font-size:.95rem; margin:0 0 .75rem; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:.4rem .3rem; border-bottom:1px solid var(--borde); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--suave); font-weight:600; font-size:.8rem; }
  tr.fila:hover { background:var(--fondo); cursor:pointer; }
  .chip { display:inline-block; padding:0 .45rem; border-radius:999px; font-size:.75rem; border:1px solid var(--borde); }
  .s4 { color:var(--peligro); border-color:var(--peligro); } .s3 { color:var(--aviso); border-color:var(--aviso); }
  .s2 { color:var(--info); border-color:var(--info); } .ok { color:var(--ok); } .error { color:var(--peligro); }
  .suave { color:var(--suave); } pre { white-space:pre-wrap; font-size:.8rem; background:var(--fondo); padding:.5rem; border-radius:6px; }
  #aviso { padding:.5rem 1rem; color:var(--peligro); }
</style>
</head>
<body>
<header>
  <h1>ResponseLab</h1>
  <label>Cliente <input id="cliente" size="10" autocomplete="off"></label>
  <label>Token <input id="token" type="password" size="28" autocomplete="off"></label>
  <button class="primario" id="cargar">Cargar</button>
  <span class="suave" id="estado"></span>
</header>
<div id="aviso"></div>
<main>
  <section>
    <h2>Aprobaciones pendientes</h2>
    <table><thead><tr><th>Acción</th><th>Motivo</th><th></th></tr></thead><tbody id="aprobaciones"></tbody></table>
    <h2 style="margin-top:1.5rem">Incidentes</h2>
    <table><thead><tr><th>Sev.</th><th>Incidente</th><th>Estado</th><th>Escalar</th></tr></thead><tbody id="incidentes"></tbody></table>
  </section>
  <section id="detalle"><h2>Detalle</h2><p class="suave">Selecciona un incidente.</p></section>
</main>
<script src="/panel.js"></script>
</body>
</html>
