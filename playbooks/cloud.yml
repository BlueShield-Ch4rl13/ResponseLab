# Capa ejecutable de la familia cloud (identidad y plano de control en la nube)
familia: cloud

triaje:
  - pregunta: El rol asignado es de administracion global, de aplicaciones o de seguridad
    evaluador:
      evento.texto_contiene: {valores: ["global administrator", "application administrator", "cloud application administrator", "security administrator", "privileged role administrator"]}
    nota: Busca el nombre del rol en el evento. Si el SIEM no lo trae, contesta que no y la pregunta no sube nada.
  - pregunta: La aplicacion que recibe consentimiento pide permisos de aplicacion y no delegados
    evaluador:
      evento.texto_contiene: {valores: ["add app role assignment to service principal", "approleassignment"]}
  - pregunta: La identidad es un service principal o una cuenta de emergencia
    evaluador:
      alguno:
        - {directorio.cuenta_en_lista: {lista: cuentas_emergencia}}
        - {evento.campo_existe: nube.sp_id}

escalado:
  a_L3_si:
    evento.regla_en: [soc_cld_005_rol_privilegiado, soc_cld_006_acceso_condicional, soc_cld_001_consentimiento_oauth]
